# Homelab stack for Raspberry Pi 5 and Raspberry Pi OS 64-bit.
# Do not edit this file. Only edit .env
# How to use:
#    ./setup.sh
#    docker compose up -d

x-common-env: &common_env
  PUID: ${PUID:?set PUID in .env}
  PGID: ${PGID:?set PGID in .env}
  TZ: ${TZ:?set TZ in .env}
  UMASK: ${UMASK:?set UMASK in .env}

services:
  qbittorrent:
    image: ${QBITTORRENT_IMAGE:?set QBITTORRENT_IMAGE in .env}
    container_name: qbittorrent
    restart: unless-stopped
    environment:
      <<: *common_env
      WEBUI_PORT: ${QBITTORRENT_WEBUI_PORT:?set QBITTORRENT_WEBUI_PORT in .env}
      TORRENTING_PORT: ${QBITTORRENT_TORRENTING_PORT:?set QBITTORRENT_TORRENTING_PORT in .env}
    ports:
      - "${QBITTORRENT_WEBUI_PORT}:${QBITTORRENT_WEBUI_PORT}"
      - "${QBITTORRENT_TORRENTING_PORT}:${QBITTORRENT_TORRENTING_PORT}/tcp"
      - "${QBITTORRENT_TORRENTING_PORT}:${QBITTORRENT_TORRENTING_PORT}/udp"
    volumes:
      - type: bind
        source: ./config/qbittorrent
        target: /config
      - type: bind
        source: ${MOVIES_DIR:?set MOVIES_DIR in .env}
        target: ${MOVIES_DIR}
      - type: bind
        source: ${TVSHOWS_DIR:?set TVSHOWS_DIR in .env}
        target: ${TVSHOWS_DIR}
      - type: bind
        source: ${TORRENT_FILES_DIR:?set TORRENT_FILES_DIR in .env}
        target: ${TORRENT_FILES_DIR}
      # Optional: separate folder for in-progress downloads
      # - type: bind
      #   source: ${INCOMPLETE_DIR}
      #   target: ${INCOMPLETE_DIR}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:${QBITTORRENT_WEBUI_PORT}/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging: &default_logging
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  jellyfin:
    image: ${JELLYFIN_IMAGE:?set JELLYFIN_IMAGE in .env}
    container_name: jellyfin
    restart: unless-stopped
    environment:
      <<: *common_env
    ports:
      - "${JELLYFIN_PORT:?set JELLYFIN_PORT in .env}:8096"
    volumes:
      - type: bind
        source: ./config/jellyfin
        target: /config
      - type: bind
        source: ./cache/jellyfin
        target: /cache
      - type: bind
        source: ${MOVIES_DIR}
        target: ${MOVIES_DIR}
        read_only: true
      - type: bind
        source: ${TVSHOWS_DIR}
        target: ${TVSHOWS_DIR}
        read_only: true
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8096/health -o /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    logging: *default_logging